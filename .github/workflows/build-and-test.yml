name: Build and Test

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  test:
    name: ${{ matrix.build-system }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-system: [cmake, autoconf]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev libblas-dev liblapack-dev cmake build-essential autoconf automake
        
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install gmp mpfr openblas cmake autoconf automake libtool
        
    - name: Build and install FLINT from source
      run: |
        git clone https://github.com/flintlib/flint.git
        cd flint
        # Bootstrap if configure doesn't exist
        if [ ! -f configure ]; then
          ./bootstrap.sh
        fi
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          ./configure --prefix=/usr/local \
                     --with-gmp="$(brew --prefix)" \
                     --with-mpfr="$(brew --prefix)" \
                     --enable-shared
        else
          ./configure --prefix=/usr/local \
                     --enable-shared
        fi
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        sudo make install
        sudo ldconfig 2>/dev/null || true
        
    - name: Build and test (CMake)
      if: matrix.build-system == 'cmake'
      run: |
        mkdir build && cd build
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_PREFIX_PATH="$(brew --prefix);/usr/local"
        else
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_PREFIX_PATH="/usr/local"
        fi
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        ctest --output-on-failure --verbose
        
    - name: Build and test (Autoconf)
      if: matrix.build-system == 'autoconf'
      run: |
        ./bootstrap.sh
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          ./configure CPPFLAGS="-I$(brew --prefix)/include -I/usr/local/include" \
                     LDFLAGS="-L$(brew --prefix)/lib -L/usr/local/lib"
        else
          ./configure CPPFLAGS="-I/usr/local/include" \
                     LDFLAGS="-L/usr/local/lib"
        fi
        make check 